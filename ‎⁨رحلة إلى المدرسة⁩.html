// ===== دوال الأرقام والأسئلة (بدون اعتماد على الصفحة) =====
const HINDI = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
const hi = (n) => String(n).replace(/\d/g, (d) => HINDI[+d]); // تحويل إلى الأرقام الهندية
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (arr) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// توليد عددين مجموعهما بدون حمل: الآحاد ≤ ٩ والعشرات ≤ ٩
function makePair(kind) {
  if (kind === 'two') { // عددان من خانتين
    const ta = rnd(1, 8), tb = rnd(1, 9 - ta), ua = rnd(1, 8), ub = rnd(1, 9 - ua);
    return [ta * 10 + ua, tb * 10 + ub];
  }
  if (kind === 'mix') { // عدد من خانتين وعدد من خانة واحدة
    const ta = rnd(1, 9), ua = rnd(1, 8), b = rnd(1, 9 - ua);
    const p = [ta * 10 + ua, b];
    return Math.random() < 0.5 ? p : [p[1], p[0]];
  }
  const a = rnd(1, 8); // عددان من خانة واحدة
  return [a, rnd(1, 9 - a)];
}

// عشرة أسئلة مختلفة
function makeQuestions(total) {
  const kinds = shuffle(['two', 'two', 'two', 'two', 'mix', 'mix', 'mix', 'mix', 'one', 'one']).slice(0, total);
  const seen = new Set();
  return kinds.map((kind) => {
    let p, key, tries = 0;
    do {
      p = makePair(kind);
      key = Math.min(p[0], p[1]) + '+' + Math.max(p[0], p[1]);
    } while (seen.has(key) && ++tries < 200);
    seen.add(key);
    return { a: p[0], b: p[1], sum: p[0] + p[1] };
  });
}

// خيارات خاطئة قريبة من الجواب الصحيح
function wrongPool(s) {
  const t = Math.floor(s / 10), u = s % 10;
  const swapped = u * 10 + t;
  const pool = [s + 1, s - 1, s + 10, s - 10, swapped, s + 2, s - 2, s + 11, s - 11, s + 9, s - 9,
    s + 20, s - 20, s + 5, s - 5, t * 10 + ((u + 1) % 10), ((t + 1) % 10) * 10 + u, t * 10 + ((u + 9) % 10)];
  return [...new Set(pool)].filter((x) => x >= 0 && x <= 99 && x !== s);
}

// أربعة خيارات: الصحيح + ثلاثة خاطئة (تُفضَّل خيارات لم تظهر في المحاولة السابقة)
function makeOptions(sum, avoid) {
  const pool = wrongPool(sum);
  const fresh = shuffle(pool.filter((x) => !avoid.includes(x)));
  const stale = shuffle(pool.filter((x) => avoid.includes(x)));
  const wrong = fresh.concat(stale).slice(0, 3);
  return shuffle([sum, ...wrong]);
}

    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function tones(freqs, dur) {
    if (!ac) return;
    try {
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur;
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t);
        o.stop(t + dur);
      });
    } catch (e) { /* لا شيء */ }
  }

  // ===== المحطات والنجوم =====
  function buildTrack() {
    marksEl.innerHTML = '';
    for (let i = 1; i <= TOTAL; i++) {
      const m = document.createElement('div');
      m.className = 'mark';
      m.id = 'mark' + i;
      m.style.right = posOf(i) + '%';
      m.textContent = hi(i);
      const s = document.createElement('div');
      s.className = 'star';
      s.id = 'star' + i;
      s.textContent = '★';
      s.style.right = posOf(i) + '%';
      marksEl.appendChild(m);
      marksEl.appendChild(s);
    }
  }
  function markDone(i) {
    $('mark' + i).classList.add('done');
    $('star' + i).classList.add('on');
  }

  // ===== الرسائل =====
  function pickMsg(list, kind) {
    let i;
    do { i = rnd(0, list.length - 1); } while (i === lastMsg[kind] && list.length > 1);
    lastMsg[kind] = i;
    return list[i];
  }
  function setFeedback(text, kind) {
    fbEl.textContent = text;
    fbEl.className = 'feedback' + (kind ? ' ' + kind : '');
  }

  // ===== عرض السؤال والخيارات =====
  function renderOptions(q) {
    const opts = makeOptions(q.sum, prevWrong);
    prevWrong = opts.filter((x) => x !== q.sum);
    optsEl.className = 'opts';
    optsEl.innerHTML = opts.map((v, i) => '<button type="button" class="opt c' + i + '" data-v="' + v + '">' + hi(v) + '</button>').join('');
  }
  function renderQuestion() {
    const q = questions[step];
    counterEl.innerHTML = 'السؤال <b>' + hi(step + 1) + '</b> من <b>' + hi(TOTAL) + '</b>';
    eqEl.innerHTML = '<bdi>' + hi(q.a) + '</bdi><span class="op">+</span><bdi>' + hi(q.b) + '</bdi><span class="op">=</span><span class="qm">؟</span>';
    prevWrong = [];
    setFeedback('اختر الإجابة الصحيحة', '');
    renderOptions(q);
  }

  // ===== الإجابة =====
  function onPick(e) {
    const btn = e.target.closest('.opt');
    if (!btn || locked || !playing) return;
    locked = true;
    const q = questions[step];
    if (+btn.dataset.v === q.sum) {
      btn.classList.add('right');
      optsEl.classList.add('done');
      setFeedback(pickMsg(PRAISE, 'ok'), 'ok');
      tones([523, 659, 784], 0.11);
      advance();
    } else {
      btn.classList.add('wrong');
      setFeedback(pickMsg(TRY, 'try'), 'try');
      setTimeout(() => { renderOptions(q); locked = false; }, 1150); // تبديل الخيارات وإعادة المحاولة
    }
  }

  // التلميذ يمشي خطوة نحو المدرسة
  function advance() {
    step++;
    markDone(step);
    student.classList.add('walking');
    student.style.right = posOf(step) + '%';
    setTimeout(() => {
      student.classList.remove('walking');
      if (step >= TOTAL) finish();
      else { renderQuestion(); locked = false; }
    }, 1300);
  }

  // ===== النهاية =====
  function finish() {
    playing = false;
    student.classList.add('enter'); // يدخل من باب المدرسة
    setTimeout(() => {
      buildConfetti();
      overlay.hidden = false;
      tones([523, 659, 784, 1047, 784, 1047], 0.13);
      $('againBtn').focus();
    }, 950);
  }
  function buildConfetti() {
    const colors = ['#ffc21a', '#2563b8', '#e8801a', '#178a4c', '#b8326a', '#7a3fb0', '#2bb3d6'];
    let html = '';
    for (let i = 0; i < 70; i++) {
      html += '<i style="left:' + rnd(0, 100) + '%;background:' + colors[i % colors.length] +
        ';animation-duration:' + (2.6 + Math.random() * 2.4).toFixed(2) + 's;animation-delay:-' + (Math.random() * 4).toFixed(2) + 's"></i>';
    }
    confettiEl.innerHTML = html;
  }

  // ===== بدء لعبة جديدة =====
  function newGame() {
    questions = makeQuestions(TOTAL);
    step = 0; locked = false; playing = true;
    student.classList.add('instant');
    student.classList.remove('enter', 'walking');
    student.style.right = posOf(0) + '%';
    buildTrack();
    void student.offsetWidth;
    student.classList.remove('instant');
    renderQuestion();
  }

  $('startBtn').addEventListener('click', () => {
    initAudio();
    startPanel.hidden = true;
    playPanel.hidden = false;
    newGame();
  });
  $('againBtn').addEventListener('click', () => {
    initAudio();
    overlay.hidden = true;
    confettiEl.innerHTML = '';
    newGame();
  });
  optsEl.addEventListener('click', onPick);

  // لا يمكن ترك اللعبة قبل إنهاء الأسئلة العشرة
  window.addEventListener('beforeunload', (e) => {
    if (playing) { e.preventDefault(); e.returnValue = ''; }
  });

  buildTrack();
})();
</script>

</body></html>
